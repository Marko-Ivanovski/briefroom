packages:
  - apps/*
  - packages/*
  - modules/*
  - plugins/*
allowBuilds:
  '@swc/core': true
  '@prisma/client': false
  better-sqlite3: false
minimumReleaseAgeExclude:
  - '@eslint/config-array@0.23.6'
  - eslint@10.15.0
  - '@playwright/test@1.65.1'
  - playwright-core@1.65.1
  - playwright@1.65.1
